<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URUPES27 JF - Demo MULTIBASE</title><style>body{font:16px Segoe UI,Arial;background:#eef8ff;color:#123;padding:22px}.box{max-width:550px;margin:5vh auto;background:white;border:1px solid #afd8ed;padding:25px;border-radius:14px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #accde4}button{background:#0b4f8a;color:white;cursor:pointer}small{color:#567}#msg{white-space:pre-wrap}</style></head><body><div class="box"><h2>PES 21PC PRO MULTIBASE</h2><p>Demo de 1 o 2 horas para una sola PC, aprobada por el administrador URUPES27 JF.</p><label>Nombre<input id="name" maxlength="120" autocomplete="name"></label><label>Correo<input id="email" type="email" maxlength="160" autocomplete="email"></label><label>ID de PC<input id="hwid" readonly></label><button id="submit">Solicitar activación</button><p id="msg"></p><small>El tiempo empieza cuando el administrador aprueba. La demo necesita Internet y solo analiza bases sin modificarlas.</small></div><script>const API='https://gmbjueygcakxfemuvxsd.supabase.co/functions/v1/multibase-demo';const el=x=>document.getElementById(x);el('hwid').value=new URLSearchParams(location.search).get('hwid')||'';el('submit').onclick=async()=>{el('msg').textContent='Enviando solicitud…';try{const r=await fetch(API+'/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:el('name').value,email:el('email').value,hwid:el('hwid').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Error de servidor');el('msg').textContent=j.status==='active'?'Esta PC ya está activada. Abrí el programa.':'Solicitud registrada. Esperá la aprobación del administrador y volvé a abrir el EXE.'}catch(e){el('msg').textContent='No se pudo registrar: '+e.message}}</script></body></html>
