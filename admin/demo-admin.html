<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URU PES ADMIN · MULTIBASE</title><style>body{font:15px Segoe UI,Arial;background:#eef8ff;color:#123;margin:0}header{background:#0b4f8a;color:#fff;padding:20px;font-weight:bold}main{max-width:1100px;margin:25px auto;background:#fff;border:1px solid #c5ddeb;border-radius:13px;padding:20px}button{background:#0b4f8a;border:0;border-radius:6px;color:white;padding:8px;cursor:pointer}button.danger{background:#933}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}#msg{color:#933}small{color:#678}</style></head><body><header>URUPES27 JF · ADMIN · DEMOS MULTIBASE</header><main><p><a href="/index.html">Volver al panel principal</a> · <button onclick="load()">Actualizar solicitudes</button></p><p>Se admite <b>una sola PC activa</b> a la vez. Al aprobar, elegí 1 o 2 horas. La activación vence automáticamente.</p><p id="msg"></p><div style="overflow-x:auto"><table><thead><tr><th>Usuario</th><th>PC</th><th>Estado</th><th>Vence (UTC)</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div><p><small>Las licencias de URU PES no se modifican.</small></p></main><script>const API='https://gmbjueygcakxfemuvxsd.supabase.co/functions/v1/multibase-demo';const tok=localStorage.urupes_admin||localStorage.cgp_admin||'';const e=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function req(path,b){const r=await fetch(API+path,{method:b?'POST':'GET',headers:{authorization:'Bearer '+tok,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Error '+r.status);return j}async function load(){if(!tok){e('msg').textContent='Primero iniciá sesión en el panel principal.';return}try{const a=await req('/admin/list');e('rows').innerHTML=a.rows.map(r=>'<tr><td>'+esc(r.full_name)+'<div><small>'+esc(r.email)+'</small></div></td><td><small>'+esc(r.hwid)+'</small></td><td>'+esc(r.status)+'</td><td>'+esc(r.expires_at||'—')+'</td><td><button data-id="'+esc(r.id)+'" data-hour="1">1 hora</button> <button data-id="'+esc(r.id)+'" data-hour="2">2 horas</button> <button class="danger" data-id="'+esc(r.id)+'" data-revoke="1">Revocar</button></td></tr>').join('');e('msg').textContent=a.rows.length?'':'No hay solicitudes todavía.'}catch(x){e('msg').textContent=x.message}}document.addEventListener('click',async ev=>{const b=ev.target.closest('button[data-id]');if(!b)return;const id=b.dataset.id;const revoke=!!b.dataset.revoke;if(!confirm(revoke?'¿Revocar esta licencia?':'¿Aprobar '+b.dataset.hour+' hora(s) para esta PC?'))return;try{await req(revoke?'/admin/revoke':'/admin/approve',{id,...(!revoke?{hours:Number(b.dataset.hour)}:{})});await load()}catch(x){e('msg').textContent=x.message}});load()</script></body></html>
