<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URU PES - Solicitud de acceso</title>
<style>
:root{--sky:#6ec6ff;--deep:#0b4f8a;--ink:#123;--bg:#eef8ff;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#dff3ff,#fff);color:var(--ink)}
header{background:var(--sky);color:#fff;padding:22px;text-align:center;font-weight:800;font-size:24px;letter-spacing:.5px;border-bottom:5px solid #fff;box-shadow:0 2px 12px #0001}
.wrap{max-width:620px;margin:38px auto;padding:0 18px}.card{background:var(--card);border:1px solid #b9ddf3;border-radius:16px;padding:24px;box-shadow:0 12px 28px #0b4f8a18}
h1{margin:0 0 8px;color:var(--deep);font-size:26px}.sub{margin:0 0 22px;color:#527}
label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #9ccbe8;border-radius:10px;font:inherit}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--deep);color:white;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.box{margin-top:18px;padding:12px;border-radius:10px;background:#f4fbff;border:1px solid #c7e8fb}.ok{color:#126b3a}.err{color:#9d1d1d}.tiny{font-size:12px;color:#678;word-break:break-all}
</style>
</head>
<body>
<header>URU PES · ACCESO</header>
<div class="wrap"><div class="card">
<h1>Solicitud de acceso URU PES</h1>
<p class="sub">Completa tus datos para solicitar acceso a URU PES.</p>
<form id="f">
<label>Nombre</label><input id="name" autocomplete="name" required>
<label>Correo</label><input id="email" type="email" autocomplete="email" required>
<div class="box"><b>Equipo detectado correctamente</b><div class="tiny">La solicitud quedará asociada a este equipo.</div></div>
<button id="send" type="submit">ENVIAR SOLICITUD</button>
</form>
<div id="msg" class="box" style="display:none"></div>
</div></div>
<script>
const API='https://gmbjueygcakxfemuvxsd.supabase.co/functions/v1/conmegol-license';
const q=new URLSearchParams(location.search);
const hwid=q.get('hwid')||'', install=q.get('install')||'', ver=q.get('v')||'URUSTARPES';

const f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('send');
f.onsubmit=async e=>{
 e.preventDefault();
 if(!hwid){msg.style.display='block';msg.className='box err';msg.textContent='No se pudo identificar el equipo. Abre esta página desde URUSTARPES.';return}
 btn.disabled=true;msg.style.display='block';msg.className='box';msg.textContent='Enviando solicitud...';
 try{
  const r=await fetch(API+'/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,hwid,install_id:install||hwid,launcher_version:ver})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||'No se pudo registrar');
  msg.className='box ok';
  msg.textContent=j.status==='active'?'Este equipo ya tiene acceso autorizado. Puedes volver a URUSTARPES.':'Solicitud enviada. Cuando el acceso sea aprobado, vuelve a URUSTARPES y pulsa INICIAR URU PES.';
 }catch(err){msg.className='box err';msg.textContent=err.message||String(err)}
 finally{btn.disabled=false}
};
</script>
</body></html>
