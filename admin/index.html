<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URU PES - Administración</title><style>body{font-family:Segoe UI,Arial;background:#eef8ff;color:#123;margin:0}header{background:#6ec6ff;color:#fff;padding:18px 22px;font-weight:800;border-bottom:4px solid #fff;box-shadow:0 2px 10px #0b4f8a22}.wrap{max-width:980px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #b9ddf3;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 8px 20px #0b4f8a12}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #9ccbe8;background:#fff;color:#123}button{cursor:pointer;background:#0b4f8a;color:#fff;border:0;font-weight:700}.danger{background:#991b1b}.muted{color:#678}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #d8eaf5;padding:9px;font-size:14px}.hide{display:none}</style></head><body><header>URU PES · ADMINISTRACIÓN</header><div class="wrap"><div id="loginCard" class="card"><h3>Acceso administrador</h3><div class="row"><input id="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button id="loginBtn">Entrar</button></div><p id="msg" class="muted"></p><div id="bootstrap" class="hide"><hr><h4>Configuración inicial</h4><div class="row"><input id="code" placeholder="Código inicial"><button id="setupBtn">Crear primer administrador</button></div></div></div><div id="panel" class="hide"><div class="card"><div class="row"><b id="who"></b><button id="refreshBtn">Actualizar</button><button class="danger" id="logoutBtn">Salir</button></div></div><div class="card"><h3>Solicitudes y licencias</h3><div id="clients"></div></div><div class="card"><h3>Administradores (máx. 5)</h3><div class="row"><input id="ae" placeholder="Correo nuevo"><input id="ap" type="password" placeholder="Contraseña temporal"><button id="addBtn">Agregar</button></div><div id="admins"></div></div></div></div><script>const API='https://gmbjueygcakxfemuvxsd.supabase.co/functions/v1/conmegol-license';let tok=localStorage.urupes_admin||localStorage.cgp_admin||'';const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}async function api(path,opt={}){const headers={...(opt.headers||{}),'content-type':'application/json'};if(tok)headers.authorization='Bearer '+tok;const r=await fetch(API+path,{...opt,headers});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j}function showPanel(){ $('loginCard').classList.add('hide');$('panel').classList.remove('hide')}async function init(){try{const s=await api('/admin/bootstrap-state');if(s.setup_required)$('bootstrap').classList.remove('hide')}catch(e){$('msg').textContent='No se pudo contactar al servidor'}if(tok){try{await loadAll();showPanel()}catch{tok='';localStorage.removeItem('urupes_admin');localStorage.removeItem('cgp_admin')}}}async function login(){try{const j=await api('/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});tok=j.token;localStorage.urupes_admin=tok;localStorage.removeItem('cgp_admin');showPanel();await loadAll()}catch(e){$('msg').textContent=e.message}}async function setup(){try{const j=await api('/admin/bootstrap',{method:'POST',body:JSON.stringify({code:$('code').value,email:$('email').value,password:$('pass').value})});tok=j.token;localStorage.urupes_admin=tok;localStorage.removeItem('cgp_admin');showPanel();await loadAll()}catch(e){$('msg').textContent=e.message}}function logout(){tok='';localStorage.removeItem('urupes_admin');localStorage.removeItem('cgp_admin');location.reload()}async function loadAll(){const j=await api('/admin/data');$('who').textContent=j.me;$('admins').innerHTML='<table><tr><th>Correo</th><th>Estado</th><th></th></tr>'+j.admins.map(a=>`<tr><td>${esc(a.email)}</td><td>${a.is_active?'Activo':'Inactivo'}</td><td><button class="danger" data-del="${a.id}">Eliminar</button></td></tr>`).join('')+'</table>';$('clients').innerHTML='<table><tr><th>Nombre</th><th>Correo</th><th>ID PC</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr>'+j.requests.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td>${esc(x.hwid)}</td><td>${esc(x.status)}</td><td>${esc(x.requested_at||'')}</td><td><button data-approve="${x.request_id}">Aprobar</button> <button class="danger" data-reject="${x.request_id}">Rechazar</button> <button class="danger" data-revoke="${x.client_id}">Revocar</button></td></tr>`).join('')+'</table>'}async function approve(id){const d=prompt('Días de licencia (0 = permanente):','90');if(d===null)return;await api('/admin/approve',{method:'POST',body:JSON.stringify({request_id:id,days:Number(d)})});await loadAll()}async function reject(id){await api('/admin/reject',{method:'POST',body:JSON.stringify({request_id:id})});await loadAll()}async function revoke(id){await api('/admin/revoke',{method:'POST',body:JSON.stringify({client_id:id})});await loadAll()}async function addAdmin(){await api('/admin/add',{method:'POST',body:JSON.stringify({email:$('ae').value,password:$('ap').value})});$('ae').value='';$('ap').value='';await loadAll()}async function delAdmin(id){if(confirm('¿Eliminar este administrador?')){try{await api('/admin/delete',{method:'POST',body:JSON.stringify({id})});await loadAll()}catch(e){alert(e.message)}}}$('loginBtn').onclick=login;$('setupBtn').onclick=setup;$('logoutBtn').onclick=logout;$('refreshBtn').onclick=loadAll;$('addBtn').onclick=addAdmin;document.addEventListener('click',e=>{const t=e.target;if(!(t instanceof HTMLElement))return;if(t.dataset.approve)approve(t.dataset.approve);if(t.dataset.reject)reject(t.dataset.reject);if(t.dataset.revoke)revoke(t.dataset.revoke);if(t.dataset.del)delAdmin(t.dataset.del)});init();</script></body></html>
